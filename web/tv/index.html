<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luminara</title>
  <link rel="stylesheet" href="/tv/tv.css?v=amber-rails-v2">
</head>
<body>
  <canvas class="ambient" id="ambient" width="192" height="108" aria-hidden="true"></canvas>
  <div class="amber-wash" id="amber-wash" aria-hidden="true"></div>
  <div class="ambient-rails" aria-hidden="true">
    <span class="rail top"></span><span class="rail right"></span>
    <span class="rail bottom"></span><span class="rail left"></span>
  </div>

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1 id="greeting">Welcome</h1>
        <p id="date" class="muted"></p>
      </div>
    </div>
    <div class="top-right">
      <span id="remotes" class="chip" hidden>
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        <span></span>
      </span>
      <time id="clock"></time>
    </div>
  </header>

  <main>
    <div id="update" class="update" hidden>
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      <div class="update-text">
        <strong>Update available</strong>
        <span id="update-detail" class="muted"></span>
      </div>
      <button id="update-install" class="btn primary" data-act="install">Install now</button>
      <button id="update-later" class="btn" data-act="later">Later</button>
    </div>
    <section class="hero" aria-live="polite">
      <p id="hero-eyebrow" class="eyebrow"></p>
      <h2 id="hero-title"></h2>
      <p id="hero-sub" class="muted"></p>
    </section>
    <ul id="tiles" class="tiles" role="listbox" aria-label="Services"></ul>
  </main>

  <footer class="bottom">
    <div class="hints">
      <span><kbd>◀</kbd><kbd>▶</kbd> Choose</span>
      <span><kbd>OK</kbd> Open</span>
    </div>
    <aside id="pair" class="pair">
      <img id="qr" alt="QR code for the remote">
      <div>
        <p class="pair-title" id="pair-title">Use your phone as the remote</p>
        <p class="muted">Scan the code, or open <strong id="url"></strong></p>
        <p class="muted fallback" id="ip-url" hidden></p>
        <p id="pin" class="pin" hidden>PIN <strong></strong></p>
      </div>
    </aside>
  </footer>

  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-logo"></div>
    <p class="splash-note">Opening…</p>
  </div>

  <section id="device-settings" class="device-settings" hidden aria-label="TV settings">
    <div class="settings-card">
      <header class="settings-head">
        <div><p class="eyebrow">Luminara</p><h2>TV settings</h2></div>
        <button id="settings-close" class="btn" type="button">Done <kbd>Esc</kbd></button>
      </header>
      <nav class="settings-tabs" aria-label="Settings sections">
        <button class="settings-tab active" data-tab="wifi">Wi-Fi</button>
        <button class="settings-tab" data-tab="bluetooth">Bluetooth</button>
        <button class="settings-tab" data-tab="audio">Audio</button>
      </nav>
      <div id="settings-content" class="settings-content"></div>
      <p class="settings-help">Use ◀ ▶ ▲ ▼ and OK on your remote or keyboard</p>
    </div>
  </section>


  <p id="status" class="status" hidden>Reconnecting…</p>
  <script src="/tv/tv.js?v=amber-rails-v2"></script>
  <script src="/tv/device-settings.js?v=audio-output-v1"></script>
</body>
</html>

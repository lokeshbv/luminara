<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Luminara TV launcher preview</title>
  <desc id="desc">A dark streaming launcher with Netflix, Prime Video, JioHotstar, YouTube, F1 TV, Browser and Settings tiles, surrounded by warm ambient corner lighting.</desc>
  <defs>
    <radialGradient id="amber" cx="0" cy="0" r="1" gradientTransform="translate(0 0) rotate(40) scale(1020 760)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f58a3c" stop-opacity=".45"/><stop offset=".42" stop-color="#c95036" stop-opacity=".2"/><stop offset="1" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="1" cy="0" r="1" gradientTransform="translate(1600 0) rotate(140) scale(970 680)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dc3d52" stop-opacity=".35"/><stop offset="1" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="1" cy="1" r="1" gradientTransform="translate(1600 900) rotate(-140) scale(1050 700)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ef8a35" stop-opacity=".33"/><stop offset="1" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#191d27"/><stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="hotstar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4116a8"/><stop offset="1" stop-color="#0c62c8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#07090e"/>
  <rect width="1600" height="900" fill="url(#amber)"/>
  <rect width="1600" height="900" fill="url(#rose)"/>
  <rect width="1600" height="900" fill="url(#gold)"/>
  <ellipse cx="-30" cy="450" rx="155" ry="340" fill="#e34d38" opacity=".14" filter="url(#blur)"/>
  <ellipse cx="1630" cy="470" rx="170" ry="330" fill="#f2a24b" opacity=".12" filter="url(#blur)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f4f5f8">
    <rect x="80" y="66" width="48" height="48" rx="15" fill="#4f63d8"/>
    <path d="m99 79 22 11-22 12z" fill="#fff"/>
    <text x="147" y="91" font-size="26" font-weight="650">Good evening</text>
    <text x="148" y="116" font-size="15" fill="#a4a8b4">Friday, October 23</text>
    <text x="1420" y="99" font-size="42" text-anchor="end" font-weight="350">7:42</text>
    <text x="1430" y="99" font-size="16" fill="#c2c4cc">PM</text>

    <text x="82" y="290" font-size="15" letter-spacing="4" fill="#e77769" font-weight="700">WATCH ON</text>
    <text x="82" y="352" font-size="56" font-weight="750">Netflix</text>
    <text x="84" y="384" font-size="20" fill="#b7bac4">Films, series and anime</text>

    <g filter="url(#shadow)">
      <rect x="70" y="470" width="276" height="122" rx="19" fill="url(#tile)" stroke="#f0f1f6" stroke-width="3"/>
      <rect x="366" y="470" width="276" height="122" rx="19" fill="url(#tile)"/>
      <rect x="662" y="470" width="276" height="122" rx="19" fill="url(#hotstar)"/>
      <rect x="958" y="470" width="276" height="122" rx="19" fill="url(#tile)"/>
      <rect x="1254" y="470" width="276" height="122" rx="19" fill="url(#tile)"/>
      <rect x="70" y="614" width="276" height="122" rx="19" fill="url(#tile)"/>
      <rect x="366" y="614" width="276" height="122" rx="19" fill="url(#tile)"/>
    </g>

    <text x="208" y="547" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="35" font-weight="900" fill="#e50914">NETFLIX</text>
    <text x="504" y="538" text-anchor="middle" font-size="27" font-weight="750"><tspan fill="#59b3f2">prime</tspan><tspan fill="#f4f5f8"> video</tspan></text>
    <path d="M464 550c26 20 60 18 82 1" fill="none" stroke="#35a8e8" stroke-width="4" stroke-linecap="round"/>
    <path d="m540 546 11 3-8 8" fill="none" stroke="#35a8e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m711 535 14-24 13 24-13 24z" fill="#fff" opacity=".96"/>
    <text x="818" y="548" text-anchor="middle" font-size="27" font-weight="600">JioHotstar</text>
    <rect x="1000" y="510" width="46" height="31" rx="9" fill="#ff0033"/>
    <path d="m1018 517 14 9-14 9z" fill="#fff"/>
    <text x="1132" y="539" text-anchor="middle" font-size="32" font-weight="750">YouTube</text>
    <path d="M1330 538c22-34 41-34 62 0 21-34 41-34 64 0" fill="none" stroke="#e34139" stroke-width="11"/>
    <text x="1392" y="565" text-anchor="middle" font-size="13" letter-spacing="2" fill="#e34139" font-weight="700">F1 TV</text>
    <circle cx="208" cy="675" r="34" fill="none" stroke="#a6d9ea" stroke-width="4"/>
    <ellipse cx="208" cy="675" rx="16" ry="34" fill="none" stroke="#a6d9ea" stroke-width="3"/>
    <path d="M176 675h64M183 656h50M183 694h50" stroke="#a6d9ea" stroke-width="3"/>
    <text x="504" y="683" text-anchor="middle" font-size="39" fill="#bec3d0">⚙</text>
    <text x="504" y="713" text-anchor="middle" font-size="15" fill="#d5d7df">Settings</text>

    <g fill="#b7bac5" font-size="14">
      <rect x="80" y="822" width="32" height="26" rx="6" fill="#303441"/><path d="m101 829-9 6 9 6z" fill="#fff"/>
      <rect x="118" y="822" width="32" height="26" rx="6" fill="#303441"/><path d="m129 829 9 6-9 6z" fill="#fff"/>
      <text x="162" y="841">Choose</text>
      <rect x="240" y="822" width="44" height="26" rx="6" fill="#303441"/><text x="262" y="840" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">OK</text>
      <text x="294" y="841">Open</text>
    </g>
    <g transform="translate(1112 764)">
      <rect width="418" height="94" rx="20" fill="#171a22" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14"/>
      <rect x="18" y="18" width="58" height="58" rx="15" fill="#10131b" stroke="#ffffff" stroke-opacity=".2"/>
      <path d="M35 36h24M35 43h24M35 50h24M35 57h24" stroke="#b9c0d0" stroke-width="3" stroke-linecap="round"/>
      <text x="94" y="39" font-size="18" font-weight="650">Phone remote ready</text>
      <text x="94" y="63" font-size="13" fill="#a5aab7">Scan the TV pairing code to connect your phone.</text>
    </g>
  </g>
</svg>
